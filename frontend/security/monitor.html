<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Patrol & CCTV Telemetry — ASTRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 25, 43, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-yellow: #ffb800;
      --accent-cyan: #00f2fe;
      --accent-red: #ff3366;
      --accent-green: #00df89;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 13, 22, 0.95);
    }

    .nav-back {
      color: var(--accent-yellow);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
      max-width: 1400px;
      width: 100%;
      margin: 24px auto;
      padding: 0 24px;
      flex: 1;
    }

    @media (max-width: 950px) {
      .layout-grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(16px);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hud-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      color: var(--accent-green);
      border: 1px solid rgba(0, 223, 137, 0.3);
      display: flex;
      gap: 16px;
    }

    .telemetry-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .tele-stat {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .tele-val {
      font-size: 24px;
      font-weight: 800;
      color: white;
      margin-top: 4px;
    }

    .btn-alert-cctv {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff0844, #ffb199);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 18px;
      transition: opacity 0.2s;
    }

    .btn-alert-cctv:hover { opacity: 0.9; }

    .alerts-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 600px;
      overflow-y: auto;
    }

    .alert-item {
      background: rgba(255, 255, 255, 0.03);
      border-left: 4px solid var(--accent-red);
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
    }

    .alert-item.HIGH { border-color: var(--accent-yellow); }
    .alert-item.CRITICAL { border-color: var(--accent-red); }

    .alert-head {
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }

    .alert-meta {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="nav-back">← Back to Portal</a>
    <div style="display: flex; gap: 12px; align-items: center;">
      <span style="font-size: 13px; color: var(--accent-yellow);">● SECTOR PATROL 4A</span>
    </div>
  </header>

  <div class="layout-grid">
    <!-- CCTV Stream & CV Telemetry -->
    <div class="card">
      <div class="card-title">
        <span>📹 Live Sector Surveillance Feed</span>
        <span style="font-size: 12px; color: var(--accent-green);">● CV TELEMETRY ACTIVE</span>
      </div>

      <div class="video-container">
        <!-- Connect directly to running complete.py stream or fallback to visual scanner -->
        <img id="cvStream" class="video-stream" src="http://127.0.0.1:5000/video_feed" 
             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1517649763962-0c623266ddc0?w=800&auto=format&fit=crop&q=60'; document.getElementById('feedStatus').innerText='CCTV 04: STREAM STANDBY';">
        <div class="hud-overlay">
          <span id="feedStatus">CCTV 04: LIVE</span>
          <span>FPS: 30.0</span>
          <span>YOLOv8 + SSD ACTIVE</span>
        </div>
      </div>

      <div class="telemetry-row">
        <div class="tele-stat">
          <div style="font-size: 12px; color: var(--text-muted);">Persons Detected</div>
          <div class="tele-val" id="valPersons">4</div>
        </div>
        <div class="tele-stat">
          <div style="font-size: 12px; color: var(--text-muted);">M/F Ratio</div>
          <div class="tele-val" id="valRatio">3.0</div>
        </div>
        <div class="tele-stat">
          <div style="font-size: 12px; color: var(--text-muted);">Threat Risk</div>
          <div class="tele-val" style="color: var(--accent-yellow);" id="valRisk">MODERATE</div>
        </div>
      </div>

      <button class="btn-alert-cctv" id="btnSendSignal">
        ⚡ Transmit Automated CV Anomaly to ASTRA
      </button>
    </div>

    <!-- Active Alerts Stream -->
    <div class="card">
      <div class="card-title">
        <span>🚨 Active Intelligence Alerts</span>
        <button onclick="fetchAlerts()" style="background:none; border:none; color:var(--accent-cyan); cursor:pointer; font-size:12px;">Refresh</button>
      </div>

      <div class="alerts-list" id="alertsContainer">
        <div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px;">
          Scanning alerts...
        </div>
      </div>
    </div>
  </div>

  <script>
    async function fetchAlerts() {
      try {
        const res = await fetch('/api/alerts/');
        if (res.ok) {
          const alerts = await res.json();
          const container = document.getElementById('alertsContainer');
          if (alerts.length === 0) {
            container.innerHTML = `<div style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px;">No active alerts at this time.</div>`;
            return;
          }
          container.innerHTML = alerts.map(a => `
            <div class="alert-item ${a.alert_level}">
              <div class="alert-head">${a.headline}</div>
              <div style="color: #cbd5e1; margin-bottom: 6px;">${a.explanation}</div>
              <div class="alert-meta">Risk: ${a.risk_score.toFixed(1)} &bull; Action: ${a.recommended_action || 'Patrol inspection'}</div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.warn('Alerts fetch error', e);
      }
    }

    document.getElementById('btnSendSignal').addEventListener('click', async () => {
      const btn = document.getElementById('btnSendSignal');
      btn.innerText = "Transmitting signal...";
      try {
        const res = await fetch('/api/incidents/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            incident_type: 'aggressive_posture',
            description: 'Automated CV Detection: Abrupt crowd convergence and high confrontation posture',
            latitude: 12.9716,
            longitude: 77.5946,
            reporter_type: 'camera_cv',
            source: 'cctv_ai',
            severity: 4
          })
        });
        if (res.ok) {
          alert("Automated CV signal successfully published to ASTRA! Clustering updated.");
          fetchAlerts();
        }
      } catch (err) {
        alert("Transmission error: " + err.message);
      } finally {
        btn.innerText = "⚡ Transmit Automated CV Anomaly to ASTRA";
      }
    });

    fetchAlerts();
    setInterval(fetchAlerts, 6000);
  </script>
</body>
</html>
